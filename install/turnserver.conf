# coturn for Dead Drop — relays call media when two browsers cannot reach each
# other directly. The secret, realm and addresses are passed on the command
# line by compose.yaml; everything here is the same for every installation.

listening-port=3478
fingerprint
use-auth-secret
min-port=49160
max-port=49999
user-quota=12
total-quota=1200

# coturn 4.19 already leaves off its admin console, its version in replies,
# NAT-behaviour discovery and DTLS; older releases need "no-cli",
# "no-software-attribute", "no-rfc5780" and "no-dtls" spelled out.
no-multicast-peers
no-tcp-relay
no-tls
stale-nonce=600
pidfile=/tmp/turnserver.pid

# Never relay into private, loopback or reserved ranges: without these, anyone
# with a credential could use the relay to reach this machine's neighbours.
# Do not add "::" or the server's own address — see DEPLOY.md §4.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# coturn logs every client address unless told not to.
no-stdout-log
log-file=/dev/null
simple-log
