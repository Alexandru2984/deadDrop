# The workflows pin every action to a commit, which only stays safe if
# someone moves the pins forward. Monthly, one grouped PR per ecosystem, so
# this is a review rather than a stream of notifications.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
  # The install kit pins its images by digest, for the same reason the
  # workflows pin actions: a tag can be moved after review. These move the
  # pins forward, one grouped PR each.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      image:
        patterns: ['*']
  - package-ecosystem: docker-compose
    directory: /install
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ['*']
