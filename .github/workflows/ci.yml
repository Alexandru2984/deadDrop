name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Go server: static analysis, build, and the full unit/integration suite
  # (includes the SRP JS↔Go cross-implementation vectors).
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      # A build that is not deterministic cannot be checked by anyone: two people
      # at the same commit would get different binaries and neither could say
      # which was right. -trimpath keeps host paths out; this keeps it honest.
      - name: Build is reproducible
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/build-a ./cmd/server/
          go build -trimpath -ldflags="-s -w" -o /tmp/build-b ./cmd/server/
          a=$(sha256sum /tmp/build-a | cut -d' ' -f1)
          b=$(sha256sum /tmp/build-b | cut -d' ' -f1)
          echo "sha256 $a  (commit ${GITHUB_SHA})"
          if [ "$a" != "$b" ]; then
            echo "::error::the same source produced two different binaries"
            exit 1
          fi

      - name: Known-vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Go security static analysis
        run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          -exclude-generated -nosec-require-rules
          -nosec-require-justification ./...
      # The seed corpora run as ordinary tests above; this explores new input on
      # every push. Short on purpose — it is a net that widens over time, not a
      # gate that has to find something today.
      - name: Fuzz the parsers
        run: |
          for target in \
            "FuzzDecodeObject ./internal/strictjson/" \
            "FuzzParseInviteCodes ./internal/auth/" \
            "FuzzValid ./internal/dnsname/" \
            "FuzzRelayEnvelope ./internal/signaling/" \
            "FuzzValidateRoomCode ./internal/signaling/"; do
            set -- $target
            echo "── $1"
            go test -run '^$' -fuzz "$1" -fuzztime 30s "$2"
          done

      - name: Git history secret scan
        run: >-
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git
          --no-banner --redact .

  # Browser crypto, run under Node with no server or stored state — hermetic.
  web-crypto:
    name: Web crypto self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hybrid handshake + sealing + ratchet
        run: node test/crypto.selftest.mjs
      - name: Bounded message and file lifecycle
        run: node test/lifecycle.selftest.mjs
      # The post-quantum half of the handshake is the one part of this repository
      # nobody here wrote. Vendoring kept the client free of package managers and
      # third-party origins, but it moved the supply chain from "npm resolves it"
      # to "somebody copied these files once".
      - name: Vendored cryptography matches upstream
        run: node scripts/verify-vendor.mjs
      # Sizes and round trips only say the thing agrees with itself. These are
      # NIST's own vectors, so they say it computes the standard.
      - name: Vendored ML-KEM-768 (incl. NIST vectors)
        run: node test/mlkem.selftest.mjs
      - name: SRP client↔server (PBKDF2 kdf)
        run: node test/srp.selftest.mjs
      - name: DTLS fingerprint media-path check
        run: node test/fingerprint.selftest.mjs
      - name: Call-signaling state machine
        run: node test/callsignal.selftest.mjs
      # Randomised, with the seed derived from the run so successive pushes
      # explore different input rather than re-checking the same shapes.
      - name: Browser parser properties
        env:
          DD_SEED: ${{ github.run_id }}
        run: node test/property.selftest.mjs
      - name: STUN/TURN response validation
        run: node test/config.selftest.mjs
      - name: Strict integrity manifest parser
        run: node test/manifest.selftest.mjs
      - name: Integrity manifest matches the served code
        run: node scripts/gen-integrity.mjs --check

  # Live zero-knowledge login flow: no browser, so it stays its own quick job.
  srp-e2e:
    name: Live SRP e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build server
        run: go build -o deaddrop ./cmd/server/
      - name: Start server
        run: .github/start-server.sh
      - name: Mint an invite code
        id: invite
        run: echo "code=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
      - name: Run live SRP e2e
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.invite.outputs.code }}
        run: node test/srp.e2e.mjs
      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true

  # Real Chrome against the real page. One job per suite, each with its own
  # runner and its own server: these were a single job running five browsers
  # back to back, where one flaky suite took every later one down with it and
  # the failure that mattered was buried under twenty timeouts.
  browser:
    name: Browser — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Executes the real page in Chrome. The Go and Node suites never run
          # the client, so only this catches a policy the browser refuses to
          # honour — a CSP directive that blocks the app's own code, or a
          # Trusted Types violation from an innerHTML assignment that crept back
          # in. The layout assertions prove the page is usable on a phone; the
          # screenshots show what it actually looks like, which no assertion can.
          # Everything protecting a conversation runs in the browser, so a
          # missing primitive is not cosmetic. This breaks one on purpose and
          # checks the app refuses instead of taking a password it cannot hold.
          - name: browser support
            suite: browser.support.mjs
          - name: smoke
            suite: browser.smoke.mjs
          # Two isolated contexts, one real WebRTC session between them: a
          # handshake over the wire, a safety code both sides compare, and a
          # saved contact recognised later without comparing anything again.
          - name: two peers
            suite: browser.pair.mjs
          # A room is a mesh of independent pairwise sessions, not a group key.
          # A mesh that reused one session across peers, or matched a code
          # against the wrong pair, would look normal from a single browser.
          - name: group room
            suite: browser.group.mjs
          # Messages ride a channel the handshake authenticates. Media does not:
          # audio and video are secured by DTLS-SRTP, whose certificate is
          # vouched for only by a fingerprint in the SDP the untrusted server
          # relayed. This checks that binding against the certificates in use.
          - name: audio/video call
            suite: browser.call.mjs
          # Every other suite has two honest clients, so every frame arrives in
          # the order the state machine expects. Comparing a safety code says
          # who is on the other end, not what their software will do next — so
          # this one runs a patched client against a stock one.
          - name: hostile peer
            suite: browser.hostile.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build server
        run: go build -o deaddrop ./cmd/server/

      - name: Start server
        run: .github/start-server.sh

      # Three is more than any suite needs; the extras cost nothing and keep
      # this step identical for every one of them.
      - name: Mint invites
        id: invites
        run: |
          echo "a=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "b=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "c=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"

      - name: Run ${{ matrix.name }}
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.invites.outputs.a }}
          DD_INVITE2: ${{ steps.invites.outputs.b }}
          DD_INVITE3: ${{ steps.invites.outputs.c }}
          DD_REQUIRE_BROWSER: '1'
          DD_SCREENSHOT_DIR: screenshots
        run: node test/${{ matrix.suite }}

      - name: Upload mobile screenshots
        if: always() && matrix.name == 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  # A second engine. Everything above drives Chrome, so on its own it only ever
  # says the app works on Blink — and the client is the whole security product
  # here. Gecko differs in the places it leans on: WebCrypto surfaces, SDP and
  # ICE behaviour, storage partitioning, and data-channel event ordering, which
  # is what broke the handshake before anyone had run it here.
  firefox:
    name: Browser — Gecko two peers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fetched straight from Mozilla rather than through a third-party action:
      # this is the browser the security tests run in, and its provenance should
      # be as short a chain as the rest of the toolchain.
      - name: Fetch Firefox
        run: |
          mkdir -p "$RUNNER_TEMP/ff" && cd "$RUNNER_TEMP/ff"
          curl -sSL -o ff.tar.xz \
            "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
          tar -xf ff.tar.xz
          echo "FIREFOX_PATH=$RUNNER_TEMP/ff/firefox/firefox" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ff/firefox/firefox" --version

      - name: Build server
        run: go build -o deaddrop ./cmd/server/
      - name: Start server
        run: .github/start-server.sh
      - name: Mint invites
        id: invites
        run: |
          echo "a=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "b=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"

      - name: Two peers on Gecko
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.invites.outputs.a }}
          DD_INVITE2: ${{ steps.invites.outputs.b }}
          DD_REQUIRE_FIREFOX: '1'
        run: node test/firefox.pair.mjs

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  # The third engine, and the one that matters most: every browser on iOS is
  # WebKit underneath, so this is as close to "does it work on an iPhone" as CI
  # can get. It cannot run on Linux — Safari has no port and WebKitGTK ships no
  # driver here — so it runs on macOS against the real thing.
  #
  # Firefox was the second engine, and its first run found a handshake race that
  # broke every Gecko session outright: no session at all, and nothing would have
  # said so until a user tried. There is no reason to expect WebKit to be kinder.
  webkit:
    name: Browser — WebKit (Safari)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Safari will not accept automation until this is turned on, and it needs
      # privilege to do it.
      - name: Allow Safari automation
        run: sudo safaridriver --enable

      - name: Build server
        run: go build -o deaddrop ./cmd/server/
      - name: Start server
        run: .github/start-server.sh
      # Three: invites are single-use, and the boot check registers an account
      # before the pair suite registers two more.
      - name: Mint invites
        id: invites
        run: |
          echo "a=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "b=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "c=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"

      # One session, so nothing here can be refused for concurrency. Whatever
      # else happens, this answers whether the client runs on WebKit at all.
      - name: Does it run on WebKit
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.invites.outputs.a }}
          DD_REQUIRE_WEBKIT: '1'
        run: node test/webkit.boot.mjs

      # Two peers needs two Safari sessions, which its driver is stricter about.
      # Kept separate so a concurrency limit reads as its own failure rather than
      # burying the answer above.
      - name: Two peers on WebKit
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.invites.outputs.b }}
          DD_INVITE2: ${{ steps.invites.outputs.c }}
          DD_REQUIRE_WEBKIT: '1'
        run: node test/webkit.pair.mjs

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

