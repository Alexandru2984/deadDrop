name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Go server: static analysis, build, and the full unit/integration suite
  # (includes the SRP JS↔Go cross-implementation vectors).
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Known-vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Go security static analysis
        run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          -exclude-generated -nosec-require-rules
          -nosec-require-justification ./...
      - name: Git history secret scan
        run: >-
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git
          --no-banner --redact .

  # Browser crypto, run under Node with no server or stored state — hermetic.
  web-crypto:
    name: Web crypto self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hybrid handshake + sealing + ratchet
        run: node test/crypto.selftest.mjs
      - name: Bounded message and file lifecycle
        run: node test/lifecycle.selftest.mjs
      - name: Vendored ML-KEM-768
        run: node test/mlkem.selftest.mjs
      - name: SRP client↔server (PBKDF2 kdf)
        run: node test/srp.selftest.mjs
      - name: DTLS fingerprint media-path check
        run: node test/fingerprint.selftest.mjs
      - name: Call-signaling state machine
        run: node test/callsignal.selftest.mjs
      - name: STUN/TURN response validation
        run: node test/config.selftest.mjs
      - name: Strict integrity manifest parser
        run: node test/manifest.selftest.mjs
      - name: Integrity manifest matches the served code
        run: node scripts/gen-integrity.mjs --check

  # Live zero-knowledge login flow plus a real-browser run of the client.
  e2e:
    name: Live SRP e2e + browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build server
        run: go build -o deaddrop ./cmd/server/

      - name: Start server
        run: |
          # ALLOW_LOCAL_ORIGINS is required for the browser job: without it the
          # allowed WebSocket origin stays the production hostname and the
          # signaling upgrade rejects the loopback page, so no room can open.
          ALLOW_LOCAL_ORIGINS=1 PORT=8100 HOST=127.0.0.1 ./deaddrop > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8100/api/config >/dev/null; then
              echo "server up"; exit 0
            fi
            sleep 0.25
          done
          echo "server did not become ready"; cat server.log; exit 1

      - name: Mint an invite code
        id: invite
        run: echo "code=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"

      - name: Run live SRP e2e
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.invite.outputs.code }}
        run: node test/srp.e2e.mjs

      # Executes the real page in Chrome. The Go and Node suites never run the
      # client, so only this catches a policy the browser refuses to honour —
      # a CSP directive that blocks the app's own code, or a Trusted Types
      # violation from an innerHTML assignment that crept back in.
      - name: Mint a second invite for the browser run
        id: uiinvite
        run: echo "code=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"

      - name: Browser smoke test
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.uiinvite.outputs.code }}
          DD_REQUIRE_BROWSER: '1'
          DD_SCREENSHOT_DIR: screenshots
        run: node test/browser.smoke.mjs

      # The layout assertions prove the page is usable on a phone; these show
      # what it actually looks like, which no assertion can.
      # Two isolated browser contexts, one real WebRTC session between them.
      # Nothing else covers the path that actually matters: a handshake over the
      # wire, a safety code both sides compare, and a saved contact recognised
      # on a later session without comparing anything again.
      - name: Mint invites for the two-peer run
        id: pairinvites
        run: |
          echo "a=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "b=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"

      - name: Two-peer end-to-end test
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.pairinvites.outputs.a }}
          DD_INVITE2: ${{ steps.pairinvites.outputs.b }}
          DD_REQUIRE_BROWSER: '1'
        run: node test/browser.pair.mjs

      # A room is a mesh of independent pairwise sessions, not a group key. A
      # mesh that reused one session across peers, or matched a safety code
      # against the wrong pair, would look completely normal from one browser.
      - name: Mint invites for the group run
        id: groupinvites
        run: |
          echo "a=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "b=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "c=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"

      - name: Three-peer group-room test
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.groupinvites.outputs.a }}
          DD_INVITE2: ${{ steps.groupinvites.outputs.b }}
          DD_INVITE3: ${{ steps.groupinvites.outputs.c }}
          DD_REQUIRE_BROWSER: '1'
        run: node test/browser.group.mjs

      # Messages ride a channel the handshake authenticates. Media does not:
      # audio and video are secured by DTLS-SRTP, whose certificate is vouched
      # for only by a fingerprint in the SDP the untrusted server relayed. The
      # client attests its real fingerprint over the encrypted channel; this
      # checks that binding against the certificates actually in use.
      - name: Mint invites for the call run
        id: callinvites
        run: |
          echo "a=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "b=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"

      - name: Audio/video call test
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.callinvites.outputs.a }}
          DD_INVITE2: ${{ steps.callinvites.outputs.b }}
          DD_REQUIRE_BROWSER: '1'
        run: node test/browser.call.mjs

      # Every other browser job has two honest clients, so every frame arrives
      # in the order the state machine expects. Comparing a safety code says who
      # is on the other end, not what their software will do next — so this one
      # runs a patched client against a stock one.
      - name: Mint invites for the hostile-peer run
        id: hostileinvites
        run: |
          echo "a=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "b=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"

      - name: Hostile-peer test
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.hostileinvites.outputs.a }}
          DD_INVITE2: ${{ steps.hostileinvites.outputs.b }}
          DD_REQUIRE_BROWSER: '1'
        run: node test/browser.hostile.mjs

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
