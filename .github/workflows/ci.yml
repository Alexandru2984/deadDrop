name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Go server: static analysis, build, and the full unit/integration suite
  # (includes the SRP JS↔Go cross-implementation vectors).
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Known-vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Go security static analysis
        run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          -exclude-generated -nosec-require-rules
          -nosec-require-justification ./...
      - name: Git history secret scan
        run: >-
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git
          --no-banner --redact .

  # Browser crypto, run under Node with no server or stored state — hermetic.
  web-crypto:
    name: Web crypto self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hybrid handshake + sealing + ratchet
        run: node test/crypto.selftest.mjs
      - name: Bounded message and file lifecycle
        run: node test/lifecycle.selftest.mjs
      - name: Vendored ML-KEM-768
        run: node test/mlkem.selftest.mjs
      - name: SRP client↔server (PBKDF2 kdf)
        run: node test/srp.selftest.mjs
      - name: DTLS fingerprint media-path check
        run: node test/fingerprint.selftest.mjs
      - name: Call-signaling state machine
        run: node test/callsignal.selftest.mjs
      - name: STUN/TURN response validation
        run: node test/config.selftest.mjs
      - name: Strict integrity manifest parser
        run: node test/manifest.selftest.mjs
      - name: Integrity manifest matches the served code
        run: node scripts/gen-integrity.mjs --check

  # Live zero-knowledge login flow: no browser, so it stays its own quick job.
  srp-e2e:
    name: Live SRP e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build server
        run: go build -o deaddrop ./cmd/server/
      - name: Start server
        run: .github/start-server.sh
      - name: Mint an invite code
        id: invite
        run: echo "code=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
      - name: Run live SRP e2e
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.invite.outputs.code }}
        run: node test/srp.e2e.mjs
      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true

  # Real Chrome against the real page. One job per suite, each with its own
  # runner and its own server: these were a single job running five browsers
  # back to back, where one flaky suite took every later one down with it and
  # the failure that mattered was buried under twenty timeouts.
  browser:
    name: Browser — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Executes the real page in Chrome. The Go and Node suites never run
          # the client, so only this catches a policy the browser refuses to
          # honour — a CSP directive that blocks the app's own code, or a
          # Trusted Types violation from an innerHTML assignment that crept back
          # in. The layout assertions prove the page is usable on a phone; the
          # screenshots show what it actually looks like, which no assertion can.
          # Everything protecting a conversation runs in the browser, so a
          # missing primitive is not cosmetic. This breaks one on purpose and
          # checks the app refuses instead of taking a password it cannot hold.
          - name: browser support
            suite: browser.support.mjs
          - name: smoke
            suite: browser.smoke.mjs
          # Two isolated contexts, one real WebRTC session between them: a
          # handshake over the wire, a safety code both sides compare, and a
          # saved contact recognised later without comparing anything again.
          - name: two peers
            suite: browser.pair.mjs
          # A room is a mesh of independent pairwise sessions, not a group key.
          # A mesh that reused one session across peers, or matched a code
          # against the wrong pair, would look normal from a single browser.
          - name: group room
            suite: browser.group.mjs
          # Messages ride a channel the handshake authenticates. Media does not:
          # audio and video are secured by DTLS-SRTP, whose certificate is
          # vouched for only by a fingerprint in the SDP the untrusted server
          # relayed. This checks that binding against the certificates in use.
          - name: audio/video call
            suite: browser.call.mjs
          # Every other suite has two honest clients, so every frame arrives in
          # the order the state machine expects. Comparing a safety code says
          # who is on the other end, not what their software will do next — so
          # this one runs a patched client against a stock one.
          - name: hostile peer
            suite: browser.hostile.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build server
        run: go build -o deaddrop ./cmd/server/

      - name: Start server
        run: .github/start-server.sh

      # Three is more than any suite needs; the extras cost nothing and keep
      # this step identical for every one of them.
      - name: Mint invites
        id: invites
        run: |
          echo "a=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "b=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"
          echo "c=$(./deaddrop invite)" >> "$GITHUB_OUTPUT"

      - name: Run ${{ matrix.name }}
        env:
          DD_URL: http://127.0.0.1:8100
          DD_INVITE: ${{ steps.invites.outputs.a }}
          DD_INVITE2: ${{ steps.invites.outputs.b }}
          DD_INVITE3: ${{ steps.invites.outputs.c }}
          DD_REQUIRE_BROWSER: '1'
          DD_SCREENSHOT_DIR: screenshots
        run: node test/${{ matrix.suite }}

      - name: Upload mobile screenshots
        if: always() && matrix.name == 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
