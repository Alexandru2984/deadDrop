name: Vulnerability watch

# CI scans on every push, but advisories are published whenever they are
# found, not when someone happens to commit. GO-2026-6809 sat against the
# production build until an unrelated change ran CI. This runs the same scan
# daily against main, so a new standard-library or dependency advisory fails
# here and GitHub mails whoever last edited this schedule.
#
# GitHub pauses scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Known-vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
