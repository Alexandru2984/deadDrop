title = "Dead Drop secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic non-secret TURN validation fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''Secret:\s*"0123456789abcdef0123456789abcdef"''']
paths = ['''^internal/turn/turn_test\.go$''']

[[allowlists]]
description = "Sample IndexNow keys in the tests of an earlier commit; the key is public by design"
targetRules = ["generic-api-key"]
regexes = ['''3f9a1c2b-?0d4e''']
paths = ['''^cmd/server/indexnow_test\.go$''']
